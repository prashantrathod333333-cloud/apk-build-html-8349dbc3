
name: Build HTML APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare Web Files
        run: |
          mkdir -p app/src/main/assets/www
          cp -r ./* app/src/main/assets/www/ || true
          rm -rf app/src/main/assets/www/app
          rm -rf app/src/main/assets/www/.github
          rm -f app/src/main/assets/www/custom_icon.png
      - name: Set Custom Icon
        run: |
          if [ -f custom_icon.png ]; then
            mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            cp custom_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp custom_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp custom_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp custom_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp custom_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
      - name: Auto-Fix Gradle Wrapper for HTML
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 || (
              curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o g.zip
              unzip -q g.zip
              ./gradle-8.9/bin/gradle wrapper
            )
          fi
          chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/debug/app-debug.apk
